name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: gcp-experiments-491309
  SERVICE: agentverge
  REGION: us-central1
  REPO: adk-repo
  RUNTIME_SA: agentverge-sa-587@gcp-experiments-491309.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source
      - name: Checkout source
        uses: actions/checkout@v4

      # 2️⃣ Authenticate to GCP using Service Account JSON key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3️⃣ Setup gcloud SDK
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4️⃣ Configure Docker auth for Artifact Registry
      - name: Configure Artifact Registry auth
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev \
            --quiet

      # 5️⃣ Build and push Docker image
      - name: Build and push container
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # 6️⃣ Deploy to Cloud Run (runtime SA + Secret Manager)
      #    Secrets GOOGLE_API_KEY, OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET must exist;
      #    the runtime SA needs secretAccessor on each.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.SERVICE }}" \
            --image "${{ env.IMAGE }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --service-account "${{ env.RUNTIME_SA }}" \
            --allow-unauthenticated \
            --set-env-vars "APP_TIMEZONE=Asia/Kolkata" \
            --set-secrets "GOOGLE_API_KEY=GOOGLE_API_KEY:latest,OAUTH_CLIENT_ID=OAUTH_CLIENT_ID:latest,OAUTH_CLIENT_SECRET=OAUTH_CLIENT_SECRET:latest"
