[project]
name = "ankit-nayak"
version = "0.1.0"
description = "AgentVerge AI Agent"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.110.0",
    "google-adk>=1.26.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "greenlet==3.0.3"
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
